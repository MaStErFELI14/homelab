name: validate
on:
  pull_request:
  workflow_dispatch:

jobs:
  # Every PR runs this workflow so the aggregate `ci-ok` check always reports
  # (needed for branch protection). Expensive jobs skip when their paths are untouched.
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      argocd: ${{ steps.diff.outputs.argocd }}
      homebridge: ${{ steps.diff.outputs.homebridge }}
      renovate: ${{ steps.diff.outputs.renovate }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - id: diff
      env:
        EVENT: ${{ github.event_name }}
        BASE: ${{ github.event.pull_request.base.sha }}
        HEAD: ${{ github.event.pull_request.head.sha }}
      run: |
        set -euo pipefail
        if [ "$EVENT" = pull_request ]; then
          files=$(git diff --name-only "$BASE" "$HEAD")
        else
          files="argocd/ renovate.json .github/workflows/validate.yaml"
        fi
        echo "$files"
        wf='^\.github/workflows/validate\.yaml$'
        hit() { if echo "$files" | grep -Eq "$1"; then echo true; else echo false; fi; }
        {
          echo "argocd=$(hit "^argocd/|$wf")"
          echo "homebridge=$(hit "^argocd/cluster-addons/homebridge/|$wf")"
          echo "renovate=$(hit "^renovate\.json$|$wf")"
        } >> "$GITHUB_OUTPUT"

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: shellcheck host scripts
      run: |
        set -euo pipefail
        shopt -s globstar nullglob
        shellcheck --version
        shellcheck --severity=warning host/**/*.sh

  renovate-config:
    name: renovate config
    needs: changes
    if: needs.changes.outputs.renovate == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: 26
    - name: validate renovate.json
      run: npx --yes pnpm@10 dlx --package renovate@44 renovate-config-validator --strict

  render:
    name: render charts
    needs: changes
    if: needs.changes.outputs.argocd == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: azure/setup-helm@v5
    - name: helm template every OCI addon
      run: |
        set -euo pipefail
        for dir in argocd/cluster-addons/*/; do
          name=$(basename "$dir")
          repo=$(yq '.repoURL' "$dir/app.yaml"); chart=$(yq '.chart' "$dir/app.yaml")
          ver=$(yq '.targetRevision' "$dir/app.yaml"); ns=$(yq '.namespace' "$dir/app.yaml")
          case "$repo" in
            http*) helm repo add "r-$name" "$repo" >/dev/null; ref="r-$name/$chart" ;;
            *)     ref="oci://$repo/$chart" ;;
          esac
          echo "::group::$name ($ref@$ver)"
          helm template "$name" "$ref" --version "$ver" -n "$ns" -f "$dir/values.yaml" >/dev/null
          echo "::endgroup::"
        done

  homebridge-smoke:
    name: homebridge image smoke test
    needs: changes
    if: needs.changes.outputs.homebridge == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: boot the pinned image on a fresh config
      run: |
        set -euo pipefail
        image=$(yq '.controllers.homebridge.containers.main.image | .repository + ":" + .tag' argocd/cluster-addons/homebridge/values.yaml)
        echo "testing $image"
        docker run -d --name hb -e HOMEBRIDGE_CONFIG_UI=1 -p 8581:8581 "$image"
        for i in $(seq 1 60); do
          code=$(curl -s -o /dev/null -m 3 -w '%{http_code}' http://localhost:8581/login || true)
          running=$(docker logs hb 2>&1 | sed 's/\x1b\[[0-9;]*m//g' | grep -c 'is running on port' || true)
          echo "try $i: ui=$code homebridge_started=$running"
          if [ "$code" = 200 ] && [ "$running" -ge 1 ]; then echo "image OK"; exit 0; fi
          sleep 5
        done
        docker logs hb 2>&1 | tail -60
        exit 1

  # Single stable check for branch protection. Skipped path-gated jobs count as OK.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, shellcheck, renovate-config, render, homebridge-smoke]
    runs-on: ubuntu-latest
    steps:
    - name: require no failed or cancelled jobs
      env:
        RESULTS: ${{ join(needs.*.result, ' ') }}
      run: |
        echo "results: $RESULTS"
        case " $RESULTS " in
          *" failure "*|*" cancelled "*) exit 1 ;;
        esac
