# Steady-state plan: follows patch releases of the current minor only (v1.36.x).
# Minor bumps stay manual: edit the channel (v1.37, ...) after checking addon compatibility
# and running a backup. Apply with: kubectl apply -f k3s-upgrade/plans/server-plan-channel.yaml
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: k3s-server
  namespace: system-upgrade
spec:
  concurrency: 1
  cordon: true
  nodeSelector:
    matchExpressions:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
  serviceAccountName: system-upgrade
  tolerations:
  - operator: Exists
  upgrade:
    image: rancher/k3s-upgrade
  channel: https://update.k3s.io/v1-release/channels/v1.36
