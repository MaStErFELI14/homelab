# Minimal values for Home Assistant Matter Server

image:
  pullPolicy: IfNotPresent

# Required by the chart; adjust to your node interface (e.g., eth0, enp1s0).
networkInterface: enp0s25

bluetoothCommissioning:
  enabled: false

service:
  type: ClusterIP
  port: 5580

ingress:
  enabled: false

persistence:
  storageClassName: local-path
  size: 2Gi

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 512Mi

podAnnotations:
  reloader.stakater.com/auto: "true"

# matter.js server needs several minutes to migrate/initialize nodes on first start;
# disable probes so it is not killed before it listens on 5580.
livenessProbe: null
readinessProbe: null

# Only Home Assistant (hostNetwork, ws://127.0.0.1:5580/ws) talks to the server:
# bind the websocket to loopback so it is not reachable from the network.
extraArgs:
  - --listen-address
  - 127.0.0.1
