global:
  domain: argocd.beaners.club
server:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 256Mi
  certificate:
    enabled: true
    issuer:
      kind: ClusterIssuer
      name: letsencrypt
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
    tls: true
configs:
  params:
    server.insecure: true
  cm:
    exec.enabled: true
notifications:
  resources:
    requests:
      cpu: 10m
      memory: 48Mi
    limits:
      memory: 256Mi
  # Secret is created out of band (key: discord-webhook-url) so the webhook URL stays out of git.
  # The live Secret carries argocd.argoproj.io/sync-options: Prune=false.
  secret:
    create: false
  notifiers:
    service.webhook.discord: |
      url: $discord-webhook-url
      headers:
      - name: Content-Type
        value: application/json
  templates:
    template.app-sync-failed: |
      webhook:
        discord:
          method: POST
          body: |
            {"content": "Argo CD: sync FAILED for {{.app.metadata.name}} (sync={{.app.status.sync.status}}, health={{.app.status.health.status}}, rev={{if .app.status.sync.revisions}}{{index .app.status.sync.revisions (sub (len .app.status.sync.revisions) 1) | trunc 7}}{{else}}{{.app.status.sync.revision | default "" | trunc 7}}{{end}})"}
    template.app-health-degraded: |
      webhook:
        discord:
          method: POST
          body: |
            {"content": "Argo CD: {{.app.metadata.name}} is DEGRADED (sync={{.app.status.sync.status}}, health={{.app.status.health.status}}, rev={{if .app.status.sync.revisions}}{{index .app.status.sync.revisions (sub (len .app.status.sync.revisions) 1) | trunc 7}}{{else}}{{.app.status.sync.revision | default "" | trunc 7}}{{end}})"}
    template.app-sync-unknown: |
      webhook:
        discord:
          method: POST
          body: |
            {"content": "Argo CD: sync status UNKNOWN for {{.app.metadata.name}} (sync={{.app.status.sync.status}}, health={{.app.status.health.status}}, rev={{if .app.status.sync.revisions}}{{index .app.status.sync.revisions (sub (len .app.status.sync.revisions) 1) | trunc 7}}{{else}}{{.app.status.sync.revision | default "" | trunc 7}}{{end}})"}
  triggers:
    trigger.on-sync-failed: |
      - when: app.status.operationState != nil and app.status.operationState.phase in ['Error', 'Failed']
        send: [app-sync-failed]
        oncePer: app.status.operationState.startedAt
    trigger.on-health-degraded: |
      - when: app.status.health.status == 'Degraded'
        send: [app-health-degraded]
    trigger.on-sync-status-unknown: |
      - when: app.status.sync.status == 'Unknown'
        send: [app-sync-unknown]
  subscriptions:
  - recipients:
    - discord
    triggers:
    - on-sync-failed
    - on-health-degraded
    - on-sync-status-unknown
# Requests ~ typical usage, generous memory limits, no CPU limits (avoid throttling).
controller:
  resources:
    requests:
      cpu: 100m
      memory: 320Mi
    limits:
      memory: 1Gi
repoServer:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 1Gi
  copyutil:
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        memory: 128Mi
applicationSet:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi
dex:
  resources:
    requests:
      cpu: 10m
      memory: 48Mi
    limits:
      memory: 256Mi
redis:
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      memory: 256Mi
