# Image tag is bumped by Renovate (see /renovate.json). Do NOT update Homebridge,
# the UI, or Node from inside the Homebridge UI: those live in the container's
# ephemeral filesystem and are lost/corrupted on pod recreation. Plugins (and
# the homebridge core pinned in /homebridge/package.json) persist on the PVC.
defaultPodOptions:
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet
  enableServiceLinks: false

controllers:
  homebridge:
    strategy: Recreate
    containers:
      main:
        image:
          repository: docker.io/homebridge/homebridge
          tag: 2026-09-25@sha256:22cdfca31934661ef9aaaa2e3fa74daa84a803fbf4c4a6c38c6bc1460b9f0596
          pullPolicy: IfNotPresent
        env:
          TZ: UTC
          HOMEBRIDGE_CONFIG_UI: "1"
          HOMEBRIDGE_CONFIG_UI_PORT: "8581"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
            add: [CHOWN, SETUID, SETGID, FOWNER, DAC_OVERRIDE]
        probes:
          liveness: &probe
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: 8581
              initialDelaySeconds: 12
              periodSeconds: 15
              timeoutSeconds: 5
              failureThreshold: 5
          readiness:
            <<: *probe
            spec:
              httpGet:
                path: /
                port: 8581
              initialDelaySeconds: 10
              periodSeconds: 12
              timeoutSeconds: 5
              failureThreshold: 4
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: 8581
              initialDelaySeconds: 10
              periodSeconds: 5
              timeoutSeconds: 3
              failureThreshold: 60
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi

service:
  homebridge:
    controller: homebridge
    ports:
      http:
        port: 8581
        protocol: HTTP

ingress:
  homebridge:
    className: traefik
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
    hosts:
    - host: homebridge.beaners.club
      paths:
      - path: /
        pathType: Prefix
        service:
          identifier: homebridge
          port: http
    tls:
    - secretName: homebridge-tls-0
      hosts:
      - homebridge.beaners.club

persistence:
  config:
    type: persistentVolumeClaim
    existingClaim: homebridge-config
    advancedMounts:
      homebridge:
        main:
        - path: /homebridge
  tmp:
    type: emptyDir
    medium: Memory
    sizeLimit: 1Gi
    advancedMounts:
      homebridge:
        main:
        - path: /tmp
        - path: /dev/shm
